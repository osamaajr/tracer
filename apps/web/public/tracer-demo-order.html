<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="tracer-demo-order" content="true" />
    <title>Order Confirmation - Tracer Demo Store</title>
    <style>
      :root {
        color: #171714;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background:
          radial-gradient(circle at 20% 0%, rgb(255 255 255 / 85%), transparent 34%),
          linear-gradient(145deg, #fffdf8 0%, #f4eee5 100%);
        margin: 0;
        min-height: 100vh;
        padding: 48px 18px;
      }

      main {
        margin: 0 auto;
        max-width: 760px;
      }

      .receipt {
        background: rgb(255 253 249 / 86%);
        border: 1px solid #e6dfd6;
        border-radius: 18px;
        box-shadow: 0 18px 60px rgb(38 35 30 / 14%);
        display: grid;
        gap: 28px;
        padding: 34px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.35rem;
        font-weight: 500;
        line-height: 1.02;
      }

      p {
        color: #625f58;
        line-height: 1.5;
      }

      .line-item {
        align-items: center;
        border-top: 1px solid #e6dfd6;
        display: grid;
        gap: 20px;
        grid-template-columns: 116px 1fr auto;
        padding-top: 24px;
      }

      .product-art {
        align-items: center;
        background: #f0ede7;
        border-radius: 14px;
        display: flex;
        height: 116px;
        justify-content: center;
        overflow: hidden;
        width: 116px;
      }

      .product-art svg {
        height: 94px;
        width: 94px;
      }

      h2 {
        font-size: 1.18rem;
      }

      .price {
        color: #171714;
        font-size: 1.2rem;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="receipt" aria-label="Demo order confirmation">
        <div>
          <h1>Thank you for your order.</h1>
          <p>Order number TR-DEMO-1001 has been confirmed.</p>
          <time datetime="2026-08-31T11:20:00.000Z">31 August 2026</time>
        </div>

        <article
          class="line-item"
          data-afterbuy-line-item
          data-afterbuy-product-name="Dyson Airwrap Complete Long"
          data-afterbuy-price-paid="£449.99"
          data-afterbuy-quantity="1"
          data-afterbuy-product-url="https://store.example.com/products/dyson-airwrap-complete-long"
        >
          <div class="product-art" aria-hidden="true">
            <svg viewBox="0 0 164 164" role="img">
              <rect width="164" height="164" fill="#f0ede7" />
              <circle cx="82" cy="78" r="42" fill="#181816" />
              <path d="M50 77c1-34 15-52 32-52s31 18 32 52" fill="none" stroke="#3a3935" stroke-width="12" stroke-linecap="round" />
              <circle cx="51" cy="92" r="21" fill="#1b1b18" />
              <circle cx="113" cy="92" r="21" fill="#1b1b18" />
              <path d="M49 112c18 12 49 12 67 0" fill="none" stroke="#2f2e2a" stroke-width="7" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <h2>Dyson Airwrap Complete Long</h2>
            <p>Multi-styler and dryer, Nickel/Copper</p>
          </div>
          <strong class="price">£449.99</strong>
        </article>
      </section>
    </main>

    <script id="tracer-demo-purchase" type="application/json">
      {
        "retailerId": "store_store-example-com",
        "retailerName": "Example Store",
        "storeHost": "store.example.com",
        "sourceUrl": "https://store.example.com/orders/TR-DEMO-1001",
        "orderReference": "TR-DEMO-1001",
        "purchasedAt": "2026-08-31T11:20:00.000Z",
        "captureMethod": "generic_schema_org",
        "captureConfidence": "high",
        "lineItems": [
          {
            "productName": "Dyson Airwrap Complete Long",
            "quantity": 1,
            "pricePaid": {
              "amountMinor": 44999,
              "currency": "GBP"
            },
            "productUrl": "https://store.example.com/products/dyson-airwrap-complete-long",
            "productUrlConfidence": "high",
            "externalProductId": "dyson-airwrap-complete-long",
            "sku": "DY-AIR-LONG-NC"
          }
        ]
      }
    </script>
  </body>
</html>
