<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="tracer-demo-order" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Confirmation - Northstar Home</title>
    <style>
      :root { color: #25231f; font-family: Inter, system-ui, sans-serif; background: #f4f0e8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(760px, calc(100% - 40px)); padding: 44px; background: #fffdf9; border: 1px solid #e6ded1; border-radius: 18px; box-shadow: 0 24px 60px rgb(47 40 31 / 10%); }
      h1 { margin: 0 0 8px; font: 500 42px Georgia, serif; }
      .muted { color: #756e64; }
      .order-meta { line-height: 1.55; }
      .item { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-top: 32px; padding-top: 28px; border-top: 1px solid #e6ded1; }
      h2 { margin: 0 0 8px; font-size: 23px; }
      .price { font-size: 23px; font-weight: 750; }
      .retailer { margin-top: 5px; font-weight: 650; color: #315e48; }
      @media (max-width: 600px) { main { padding: 26px; } .item { grid-template-columns: 1fr; } .price { justify-self: start; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Thank you for your order.</h1>
      <div class="order-meta muted">Order number NS-778899 has been confirmed.</div>
      <div class="order-meta muted">7 September 2026</div>
      <section class="item" data-afterbuy-line-item>
        <div>
          <h2 data-afterbuy-product-name>Fellow Stagg EKG Kettle, Matte Black</h2>
          <div class="retailer">Northstar Home</div>
          <div class="muted">Electric gooseneck kettle</div>
          <a href="https://northstar.example/products/stagg-ekg-kettle" data-afterbuy-product-url>View product</a>
        </div>
        <div class="price" data-afterbuy-price-paid>£165.00</div>
      </section>
    </main>
    <script id="tracer-demo-purchase" type="application/json">
      {
        "retailerId": "store_northstar-example",
        "retailerName": "Northstar Home",
        "storeHost": "northstar.example",
        "sourceUrl": "https://northstar.example/checkout/confirmation/NS-778899",
        "orderReference": "NS-778899",
        "purchasedAt": "2026-09-07T10:15:00.000Z",
        "lineItems": [{
          "productName": "Fellow Stagg EKG Kettle, Matte Black",
          "quantity": 1,
          "pricePaid": { "amountMinor": 16500, "currency": "GBP" },
          "productUrl": "https://northstar.example/products/stagg-ekg-kettle",
          "productUrlConfidence": "high",
          "externalProductId": "stagg-ekg-black",
          "sku": "STAGG-EKG-BLK"
        }]
      }
    </script>
  </body>
</html>
