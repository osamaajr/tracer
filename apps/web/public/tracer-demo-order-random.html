<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="tracer-demo-order" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Confirmation - Moonbeam Market</title>
    <style>
      :root { color: #25231f; font-family: Inter, system-ui, sans-serif; background: #f4f0e8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(760px, calc(100% - 40px)); padding: 44px; background: #fffdf9; border: 1px solid #e6ded1; border-radius: 18px; box-shadow: 0 24px 60px rgb(47 40 31 / 10%); }
      h1 { margin: 0 0 8px; font: 500 42px Georgia, serif; }
      .muted { color: #756e64; }
      .order-meta { line-height: 1.55; }
      .item { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-top: 32px; padding-top: 28px; border-top: 1px solid #e6ded1; }
      h2 { margin: 0 0 8px; font-size: 23px; }
      .price { font-size: 23px; font-weight: 750; }
      .retailer { margin-top: 5px; font-weight: 650; color: #315e48; }
      /* The demo page is used to test the extension popup, so never show the legacy in-page card. */
      #afterbuy-protect-root { display: none !important; }
      @media (max-width: 600px) { main { padding: 26px; } .item { grid-template-columns: 1fr; } .price { justify-self: start; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Thank you for your order.</h1>
      <div class="order-meta muted">Order number MM-492017 has been confirmed.</div>
      <div class="order-meta muted">8 September 2026</div>
      <section class="item" data-afterbuy-line-item>
        <div>
          <h2 data-afterbuy-product-name>LEGO Icons Bonsai Tree 10281</h2>
          <div class="retailer">Moonbeam Market</div>
          <div class="muted">Botanical Collection building set</div>
          <a href="https://moonbeam.example/products/lego-bonsai-tree-10281" data-afterbuy-product-url>View product</a>
        </div>
        <div class="price" data-afterbuy-price-paid>£44.99</div>
      </section>
    </main>
    <script id="tracer-demo-purchase" type="application/json">
      {
        "retailerId": "store_moonbeam-example",
        "retailerName": "Moonbeam Market",
        "storeHost": "moonbeam.example",
        "sourceUrl": "https://moonbeam.example/checkout/confirmation/MM-492017",
        "orderReference": "MM-492017",
        "purchasedAt": "2026-09-08T12:20:00.000Z",
        "lineItems": [{
          "productName": "LEGO Icons Bonsai Tree 10281",
          "quantity": 1,
          "pricePaid": { "amountMinor": 4499, "currency": "GBP" },
          "productUrl": "https://moonbeam.example/products/lego-bonsai-tree-10281",
          "productUrlConfidence": "high",
          "externalProductId": "lego-icons-bonsai-10281",
          "sku": "10281"
        }]
      }
    </script>
  </body>
</html>
